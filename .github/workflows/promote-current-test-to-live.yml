name: Promote current TEST to LIVE

on:
  push:
    paths:
      - '.github/workflows/promote-current-test-to-live.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current TEST into LIVE
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/gunpowderstudios/website-test.git /tmp/website-test
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='staging-editor.js' \
            --exclude='staging-image-helper.js' \
            /tmp/website-test/ ./

          rm -f staging-editor.js staging-image-helper.js .DS_Store

          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')

              # Strip TEST-only editor/helper script tags.
              text = re.sub(
                  r'<script\b[^>]*\bsrc=["\'][^"\']*(?:staging-editor|staging-image-helper)\.js[^"\']*["\'][^>]*>\s*</script>',
                  '', text, flags=re.I
              )

              # Remove visible development bars from published pages.
              text = re.sub(
                  r'<div\s+class=["\']devbar["\'][^>]*>.*?</div>\s*',
                  '', text, flags=re.I | re.S
              )

              # Ensure no visible STAGING marker survives publication.
              text = text.replace('STAGING · ', '').replace('STAGING ·', '').replace('STAGING', '')

              path.write_text(text, encoding='utf-8')
          PY

          # The publication workflow must not remain in LIVE.
          rm -rf .github

          # Publication checks.
          test -f bag-of-dungeon-legends/index.html
          test -f product/bag-of-dungeon-legends-pack/index.html
          test -f lightbox.js
          test ! -e staging-editor.js
          test ! -e staging-image-helper.js
          ! grep -RniE 'staging-editor\.js|staging-image-helper\.js|STAGING' --include='*.html' .
          grep -q 'object-fit:cover' index.html

      - name: Commit and push LIVE
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gunpowder Studios'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Promote current TEST to LIVE'
          git push origin main
