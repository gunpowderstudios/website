name: Promote TEST to LIVE

on:
  push:
    paths:
      - '.github/workflows/promote-test-to-live.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch TEST
        run: git clone --depth 1 https://github.com/gunpowderstudios/website-test.git /tmp/website-test

      - name: Sync approved TEST files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='staging-editor.js' \
            /tmp/website-test/ ./

      - name: Remove staging-only editor and labels
        run: |
          rm -f staging-editor.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')

              # Editor is TEST-only and must never ship to LIVE.
              text = re.sub(r'\s*<script\s+src="(?:\.\./|\.\./\.\./)?staging-editor\.js"></script>\s*', '\n', text)

              # Remove visible staging wording while keeping noindex until final domain cutover.
              text = text.replace('STAGING · ', '')
              text = re.sub(r'\.devbar:before\{content:"STAGING";[^}]*\}', '', text)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-off promotion workflow
        run: rm -f .github/workflows/promote-test-to-live.yml

      - name: Commit LIVE release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to promote"
            exit 0
          fi
          git commit -m "v3.3 - promote TEST to LIVE without editor"
          git push
