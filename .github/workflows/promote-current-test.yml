name: Promote current TEST to LIVE
on:
  push:
    paths:
      - '.github/workflows/promote-current-test.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone exact TEST state
        run: |
          git clone --quiet https://github.com/gunpowderstudios/website-test.git /tmp/website-test
          cd /tmp/website-test
          git checkout --quiet c53224abfcb399d951caf6844a8df07ed9277646
      - name: Promote TEST content without editor tooling
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='staging-editor.js' \
            --exclude='staging-image-helper.js' \
            --exclude='staging-layout-helper.js' \
            /tmp/website-test/ ./
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<script[^>]*src=["\'][^"\']*staging-editor\.js[^"\']*["\'][^>]*>\s*</script>\s*', '', s, flags=re.I)
              s = re.sub(r'<div\s+class=["\']devbar["\'][^>]*>.*?</div>\s*', '', s, flags=re.I|re.S)
              s = s.replace('STAGING · ', '').replace('STAGING&nbsp;· ', '')
              s = s.replace('content:"STAGING"', 'content:""').replace("content:'STAGING'", "content:''")
              s = re.sub(r'\sdata-gps-(?:edit|link)-id=["\'][^"\']*["\']', '', s, flags=re.I)
              s = re.sub(r'\scontenteditable=["\'](?:true|false)["\']', '', s, flags=re.I)
              s = re.sub(r'\sspellcheck=["\'](?:true|false)["\']', '', s, flags=re.I)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .DS_Store staging-editor.js staging-image-helper.js staging-layout-helper.js lightbox.js
          rm -f .github/workflows/promote-current-test.yml
      - name: Verify LIVE tree is clean
        run: |
          test ! -e staging-editor.js
          test ! -e staging-image-helper.js
          test ! -e staging-layout-helper.js
          test ! -e lightbox.js
          test ! -e .DS_Store
          ! grep -RIlE 'staging-editor\.js|staging-image-helper\.js|staging-layout-helper\.js|lightbox\.js|STAGING' --include='*.html' . >/tmp/bad || (cat /tmp/bad && exit 1)
          grep -RIl 'noindex, nofollow' --include='*.html' . >/dev/null
      - name: Commit LIVE promotion safely
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Promote current TEST content to LIVE" -m "Promoted from TEST c53224abfcb399d951caf6844a8df07ed9277646"
          git pull --rebase origin main
          for i in 1 2 3; do
            git push origin main && exit 0
            sleep 2
            git pull --rebase origin main
          done
          exit 1
