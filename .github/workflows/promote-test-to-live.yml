name: Promote TEST to LIVE
on:
  push:
    paths:
      - '.github/workflows/promote-test-to-live.yml'

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout LIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current TEST
        run: |
          git clone --depth 1 https://github.com/gunpowderstudios/website-test.git /tmp/website-test
          echo "TEST_SHA=$(git -C /tmp/website-test rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Promote TEST content without editor tooling
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='staging-editor.js' \
            --exclude='staging-image-helper.js' \
            /tmp/website-test/ ./

          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')

              # Remove TEST-only editor script references.
              s = re.sub(
                  r'<script\b[^>]*\bsrc=["\'][^"\']*staging-editor\.js[^"\']*["\'][^>]*>\s*</script>',
                  '', s, flags=re.I
              )

              # Remove visible TEST/STAGING bars used only during development.
              s = re.sub(
                  r'<div\b[^>]*class=["\'][^"\']*\bdevbar\b[^"\']*["\'][^>]*>.*?</div>',
                  '', s, flags=re.I | re.S
              )
              s = re.sub(
                  r'<div\b[^>]*class=["\'][^"\']*\btopbar\b[^"\']*["\'][^>]*>\s*<div\b[^>]*class=["\'][^"\']*\bwrap\b[^"\']*["\'][^>]*>[^<]*STAGING[^<]*</div>\s*</div>',
                  '', s, flags=re.I | re.S
              )

              # Strip editor-state attributes that may have been serialized by browser editing.
              s = re.sub(r'\sdata-gps-edit-id=("[^"]*"|\'[^\']*\')', '', s, flags=re.I)
              s = re.sub(r'\scontenteditable=("[^"]*"|\'[^\']*\')', '', s, flags=re.I)
              s = re.sub(r'\sspellcheck=("[^"]*"|\'[^\']*\')', '', s, flags=re.I)

              # No STAGING label should appear on LIVE, even in generated CSS content.
              s = s.replace('STAGING · ', '').replace('STAGING', '')

              p.write_text(s, encoding='utf-8')
          PY

          rm -f staging-editor.js staging-image-helper.js .DS_Store
          find . -name '.DS_Store' -delete

          # The temporary promotion workflow must not remain on LIVE.
          rm -f .github/workflows/promote-test-to-live.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Verify LIVE tree is clean
        run: |
          test -f lightbox.js
          test ! -e staging-editor.js
          test ! -e staging-image-helper.js
          test ! -d .github
          test ! -e .DS_Store

          if grep -RIl --include='*.html' -E 'staging-editor\.js|staging-image-helper\.js|data-gps-edit-id=|contenteditable=|spellcheck=' .; then
            echo 'TEST editor residue found in LIVE candidate'
            exit 1
          fi

          if grep -RIl --include='*.html' 'STAGING' .; then
            echo 'Visible STAGING residue found in LIVE candidate'
            exit 1
          fi

          # Keep pre-cutover noindex on the main public pages.
          grep -qi 'noindex' index.html
          grep -qi 'noindex' bag-of-dungeon/index.html
          grep -qi 'noindex' 7-moons/index.html
          grep -qi 'noindex' book-of-dungeon/index.html
          grep -qi 'noindex' kastles-card-game/index.html

      - name: Commit LIVE promotion safely
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add -A
          git commit -m "v3.6 - promote TEST to LIVE without editor" -m "Promoted from TEST ${TEST_SHA}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
